<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2A6495">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Badawi Fleet">
  
  <link rel="apple-touch-icon" href="./brand/apple-touch-icon-180.png">
  <link rel="icon" type="image/png" href="./brand/mark.png">
  <link rel="manifest" href="./manifest.json">

  <title>منصة أسطول أبناء بدوي</title>

  <style>
    :root {
      --bg: #D8DDE6;
      --card: #FFFFFF;
      --ink: #14171F;
      --mute: #6B7280;
      --line: #E3E5EA;
      --acc: #2A6495;
      --acc-ink: #FFFFFF;
      --soft: #EAEDF3;
      --ok: #2E9B6A;
      --bad: #D8514F;
      --warn: #D9921A;
      --r: 14px;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0E1218;
        --card: #161B23;
        --ink: #E6E9EF;
        --mute: #8B93A1;
        --line: #232A36;
        --acc: #7DB4E6;
        --acc-ink: #0B1B2B;
        --soft: #1E2530;
        --ok: #4CC38A;
        --bad: #F0706E;
        --warn: #F2B04A;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      direction: rtl;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./src/main.tsx"></script>
</body>
</html>
