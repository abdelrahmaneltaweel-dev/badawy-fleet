<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2A6495">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Badawi Fleet">
  
  <link rel="apple-touch-icon" href="./brand/apple-touch-icon-180.png">
  <link rel="icon" type="image/png" href="./brand/mark.png">
  <link rel="manifest" href="./manifest.json">

  <title>منصة أسطول أبناء بدوي</title>
  <meta name="description" content="منصة متابعة أسطول شركة أبناء بدوي للمقاولات">
  <meta property="og:title" content="منصة أسطول أبناء بدوي">
  <meta property="og:description" content="منصة متابعة أسطول شركة أبناء بدوي للمقاولات">

  <!-- Comprehensive Anti-Flicker Inline Script: Resolves Theme, Font & Size before first paint -->
  <script>
    (function() {
      try {
        var rawPref = localStorage.getItem('badawi_user_appearance_pref_v1');
        var pref = rawPref ? JSON.parse(rawPref) : null;
        var mode = pref ? pref.themeMode : (localStorage.getItem('badawi-theme') || 'auto');
        var dark = mode === 'dark' || (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');

        if (pref) {
          if (pref.fontFamily) {
            document.documentElement.setAttribute('data-font', pref.fontFamily);
          }
          if (pref.baseFontSizePx && pref.baseFontSizePx >= 13 && pref.baseFontSizePx <= 18) {
            document.documentElement.style.setProperty('--font-size-base', pref.baseFontSizePx + 'px');
          }
          if (pref.motionReduced) {
            document.documentElement.setAttribute('data-motion', 'reduced');
          }
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./src/main.tsx"></script>
</body>
</html>
