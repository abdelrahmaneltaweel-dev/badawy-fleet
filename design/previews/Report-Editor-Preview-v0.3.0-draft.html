<title>Badawi Fleet — محرر التقارير v0.3.0 (draft)</title>
<style>
:root{--bg:#D8DDE6;--g:#F5F6FA;--ink:#14171F;--mute:#6B7280;--line:#E3E5EA;--grid:#E9EBF0;--acc:#2A6495;--acc-ink:#fff;--soft:#EAEDF3;--card:#fff;--ok:#2E9B6A;--bad:#D8514F;--warn:#D9921A;--sel:rgba(42,100,149,.11);--e:cubic-bezier(.2,.8,.2,1);color-scheme:light}
:root[data-theme="dark"]{--bg:#0E1218;--g:#161B23;--ink:#E6E9EF;--mute:#8B93A1;--line:#262D39;--grid:#232A36;--acc:#7DB4E6;--acc-ink:#0B1B2B;--soft:#1E2530;--card:#1C232D;--ok:#4CC38A;--bad:#F0706E;--warn:#F2B04A;--sel:rgba(125,180,230,.15);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 "IBM Plex Sans Arabic","Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;padding-bottom:calc(30px + env(safe-area-inset-bottom,0px));transition:background-color .3s}
body.dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
.i{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;max-width:1180px;margin:auto}
.bc{display:flex;align-items:center;gap:8px;min-width:0}.bc img{height:26px}.bc span,.bc i{color:var(--mute)}.bc i{font-style:normal}.bc b{white-space:nowrap}
.hr{display:flex;align-items:center;gap:8px}
.seg{display:inline-flex;background:var(--soft);border-radius:99px;padding:3px}
.seg button{border:0;background:none;color:var(--mute);font:inherit;font-size:.78rem;padding:2px 12px;border-radius:99px;cursor:pointer;transition:background-color .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(20,23,31,.12)}
.ib{width:34px;height:34px;border-radius:10px;border:0;background:transparent;color:var(--mute);display:grid;place-items:center;cursor:pointer;transition:background-color .15s,color .15s,transform .12s}
.ib:hover{background:var(--soft);color:var(--ink)}.ib:active{transform:scale(.9)}.ib[aria-pressed="true"],.ib.on{background:var(--soft);color:var(--acc)}.ib:disabled{opacity:.35;pointer-events:none}
.wrap{max-width:1180px;margin:auto;padding:0 16px}
.note{display:none;margin-bottom:12px;padding:10px 14px;border-radius:12px;background:var(--g);border:1px solid var(--line);font-size:.86rem}
.panel{background:var(--g);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(20,23,31,.04)}
.pb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.chip{font:inherit;font-size:.84rem;background:var(--card);border:1px solid var(--line);color:var(--ink);padding:2px 14px;border-radius:99px;cursor:pointer;transition:transform .15s var(--e),background-color .15s,border-color .15s}
.chip:active{transform:scale(.94)}.chip[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);font-weight:700;background:color-mix(in srgb,var(--acc) 8%,var(--card))}
.btn{font:inherit;font-weight:600;font-size:.88rem;border-radius:10px;padding:5px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:7px;min-height:36px;position:relative;overflow:hidden;white-space:nowrap;transition:transform .15s var(--e),background-color .15s,border-color .15s,filter .15s}
.btn:active{transform:scale(.96)}.btn:hover{border-color:var(--mute)}
.btn.p{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}.btn.p:hover{filter:brightness(1.06)}.btn.g{border-color:transparent;background:transparent;color:var(--mute)}
.btn .i{width:17px;height:17px}
.pill{font-size:.76rem;padding:1px 10px;border-radius:99px;background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);font-weight:700;display:none}
.rb{display:none;align-items:center;gap:2px;overflow-x:auto;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--card);scrollbar-width:none}
.rb.on{display:flex;animation:in .22s var(--e)}@keyframes in{from{opacity:0;transform:translateY(-6px)}}
.rb .sep{width:1px;height:22px;background:var(--line);margin:0 6px;flex:none}
.rb .ib{flex:none}.rb .sp{flex:1;min-width:8px}
.sw{width:15px;height:4px;border-radius:2px;position:absolute;bottom:5px;inset-inline:0;margin:auto}
.ib{position:relative}
.tw{position:relative;overflow:auto;background:var(--card);max-height:62vh}
table{width:100%;min-width:680px;border-collapse:separate;border-spacing:0;font-size:.92rem}
th{position:sticky;top:0;z-index:3;background:var(--g);color:var(--mute);font-size:.78rem;font-weight:600;text-align:start;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;transition:background-color .15s,color .15s}
.edit th[data-ci]{cursor:pointer}.edit th[data-ci]:hover{background:var(--soft);color:var(--ink)}
th.cs{background:var(--sel)!important;color:var(--acc)}
td{padding:9px 12px;border-bottom:1px solid var(--grid);background:var(--card);position:relative;transition:background-color .12s}
.edit td[data-ci]{border-inline-start:1px solid var(--grid);cursor:cell}
tbody tr:hover td{background-image:linear-gradient(var(--soft),var(--soft))}
td.in{background-image:linear-gradient(var(--sel),var(--sel))!important}
td.ac{outline:2px solid var(--acc);outline-offset:-2px;z-index:2}
td.r{text-align:end}
tr.sel td{background-image:linear-gradient(var(--sel),var(--sel))}
tr.lift{opacity:.28}tr.hid{opacity:.4}tr.hid td{text-decoration:line-through}
.edit tbody tr{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
td.ov::after{content:"";position:absolute;top:3px;inset-inline-end:3px;border:4px solid var(--acc);border-bottom-color:transparent;border-inline-start-color:transparent;width:0;height:0}
td[contenteditable]{outline:2px solid var(--acc);outline-offset:-2px;background:var(--card)!important;cursor:text;user-select:text}
td.gut,th.gut{width:58px;min-width:58px;padding:0 6px;text-align:center;color:var(--mute);font-size:.78rem;background:var(--g);cursor:pointer;position:sticky;inset-inline-start:0;z-index:2}
th.gut{z-index:4}
td.gut .gi{display:flex;align-items:center;justify-content:space-between;gap:2px;min-height:26px}
td.gut:hover{color:var(--ink)}tr.sel td.gut{background:color-mix(in srgb,var(--acc) 20%,var(--g));color:var(--acc);font-weight:700}
.grip{width:20px;height:24px;display:grid;place-items:center;color:var(--mute);cursor:grab;touch-action:none;border-radius:6px;opacity:.55;transition:opacity .15s,background-color .15s}
tr:hover .grip,tr.sel .grip{opacity:1}.grip:hover{background:var(--soft);color:var(--acc)}.grip svg{width:15px;height:15px;fill:currentColor}
tfoot td{font-weight:700;background:var(--g);border-bottom:0;position:sticky;bottom:0;z-index:2}
.dl{position:absolute;inset-inline:0;height:3px;background:var(--acc);border-radius:3px;display:none;pointer-events:none;z-index:6;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.gh{position:fixed;z-index:90;pointer-events:none;display:none;background:var(--card);border:1px solid var(--acc);border-radius:12px;padding:8px 16px;font-weight:700;box-shadow:0 18px 40px rgba(20,23,31,.28);transform:scale(1.02);animation:lf .16s var(--e)}
@keyframes lf{from{transform:scale(.96);opacity:.6}}
.gh .bd{position:absolute;top:-10px;inset-inline-start:-10px;min-width:24px;height:24px;border-radius:99px;background:var(--acc);color:var(--acc-ink);font-size:.78rem;display:grid;place-items:center;padding:0 6px}
.sb{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--line);font-size:.8rem;color:var(--mute);background:var(--g)}
.sb b{color:var(--ink);font-weight:600}.sb .st>span{margin-inline-end:14px}
.sk{height:14px;border-radius:8px;background:linear-gradient(90deg,var(--line) 25%,var(--soft) 50%,var(--line) 75%);background-size:200% 100%;animation:sh 1.2s linear infinite}@keyframes sh{to{background-position:-200% 0}}
.pop{position:fixed;z-index:70;display:none;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 44px rgba(20,23,31,.22);padding:12px;min-width:210px;max-width:320px}
.pop.on{display:block;animation:pp .16s var(--e)}@keyframes pp{from{opacity:0;transform:translateY(-6px) scale(.98)}}
.pop h4{margin:0 0 8px;font-size:.84rem;color:var(--mute);font-weight:600}
.pg{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.c{aspect-ratio:1;border-radius:50%;border:1px solid var(--line);cursor:pointer;transition:transform .12s var(--e);position:relative}.c:hover{transform:scale(1.14)}.c:active{transform:scale(.9)}
.c.x::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 46%,var(--bad) 47% 53%,transparent 54%)}
.rl{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;background:var(--soft);margin-bottom:6px;font-size:.86rem}.rl .c{width:18px;flex:none}.rl button{margin-inline-start:auto}
.fr{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.fr input{width:70px;font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);padding:3px 8px;min-height:32px;direction:ltr;text-align:end}
.bd2{display:none}
@media (max-width:760px){
 .pop{inset-inline:0;bottom:0;top:auto;max-width:none;border-radius:20px 20px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));min-width:0}
 .pop.on{animation:up .2s var(--e)}@keyframes up{from{transform:translateY(30px);opacity:.4}}
 .bd2.on{display:block;position:fixed;inset:0;background:rgba(5,15,25,.5);z-index:65}
 .c{max-width:38px}.hd .bc span{display:none}
}
.toast{position:fixed;inset-inline:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));margin-inline:auto;max-width:380px;background:var(--ink);color:var(--card);padding:11px 16px;border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.3);transform:translateY(26px);opacity:0;pointer-events:none;transition:transform .3s var(--e),opacity .25s;z-index:95;text-align:center}.toast.show{transform:none;opacity:1}

.bc{flex:1;min-width:0}.bc b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.demo{display:flex;align-items:center;gap:8px;margin:0 2px 10px;color:var(--mute);font-size:.8rem;flex-wrap:wrap}
.seg button{white-space:nowrap}
.rb{align-items:center;gap:8px}.rb.on{display:flex}
.rt{display:flex;align-items:center;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}.rt::-webkit-scrollbar{display:none}
.ra{display:flex;gap:6px;flex:none}
td.gut,th.gut{width:52px;min-width:52px}
.fz{position:sticky;inset-inline-start:0;z-index:2;border-inline-end:1px solid var(--line);font-weight:600}
th.fz{z-index:5}.edit .fz{inset-inline-start:52px}
th,td{white-space:nowrap}
.pill{white-space:nowrap}
@media (max-width:760px){
 .rb.on{flex-wrap:wrap}.rt{flex:1 1 100%;display:grid;grid-template-columns:repeat(6,1fr);justify-items:center;overflow:visible;gap:4px 2px}.rt .sep{display:none}.rt .ib{width:40px;height:40px}
 .ra{flex:1 1 100%;border-top:1px solid var(--line);padding-top:8px}.ra .btn{flex:1;justify-content:center;min-height:42px}
 .pb{gap:8px}.pb .chips{flex:1 1 100%}.pb .btn{flex:1;justify-content:center}.pb .pill{order:-1}
}

.fqw{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 10px;min-height:36px;flex:1 1 140px;max-width:220px}
.fqw input{border:0;background:none;font:inherit;color:var(--ink);outline:none;min-width:0;width:100%}.fqw .i{width:16px;height:16px;color:var(--mute)}
.tags{display:none;gap:6px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line)}.tg{font-size:.78rem;background:var(--soft);color:var(--acc);padding:1px 10px;border-radius:99px;cursor:pointer;font-weight:600}
.btn:disabled{opacity:.4;pointer-events:none}
th .tl{pointer-events:none}
th .cm{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;margin-inline-start:4px;color:var(--mute);cursor:pointer;vertical-align:middle;transition:background-color .15s}
th .cm:hover{background:var(--soft);color:var(--ink)}
.rz{position:absolute;top:0;bottom:0;inset-inline-end:-3px;width:8px;cursor:col-resize;z-index:7}.rz:hover,body.rsz .rz{background:color-mix(in srgb,var(--acc) 40%,transparent)}
body.rsz{cursor:col-resize;user-select:none}
tr.gr td{background:var(--soft);font-weight:700;cursor:pointer}tr.sub td{background:var(--g);font-weight:700;color:var(--mute);border-bottom:1px solid var(--line)}tr.ttl td{background:var(--g);font-weight:800}
td.cc{background-image:linear-gradient(color-mix(in srgb,var(--acc) 6%,transparent),color-mix(in srgb,var(--acc) 6%,transparent))}
td.nt::before{content:"";position:absolute;top:0;inset-inline-start:0;border:5px solid var(--warn);border-bottom-color:transparent;border-inline-end-color:transparent}
td.fd{box-shadow:inset 0 0 0 2px var(--warn)}
.pop .chip{margin:0}
.pr-hd{display:none}
@page{size:A4 landscape;margin:12mm}
@media print{
 body{background:#fff!important;color:#000;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .hd,.demo,.note,.pb,.rb,.tags,.sb,#hint,.pop,.bd2,.toast,.gh{display:none!important}
 .panel{border:0;box-shadow:none;background:#fff}.tw{max-height:none!important;overflow:visible!important}.wrap{max-width:none;padding:0}
 .pr-hd{display:flex;align-items:center;gap:12px;margin-bottom:10px}.pr-hd img{height:34px}.pr-hd b{font-size:1.2rem}.pr-hd span{display:block;color:#555}
 th.gut,td.gut,.cm,.rz{display:none!important}th,td,tfoot td{position:static!important}
 table{min-width:0;font-size:11pt}th{background:#eee!important;color:#000}td{background:#fff;border:1px solid #ccc;color:#000}
}
html.tt *{transition:background-color .3s,color .3s,border-color .3s!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
