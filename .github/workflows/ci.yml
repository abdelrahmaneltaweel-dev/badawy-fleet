name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret & Pattern Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Scan for forbidden patterns and secrets
        run: |
          echo "Scanning for forbidden keywords..."
          ! grep -rnIE "traccar.*\.com|http://[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+|eyJhbGciOi" \
            --exclude-dir={.git,node_modules,dist} \
            --exclude="*.png" \
            --exclude="*.jpg" \
            --exclude="*.svg" .

  build-web:
    name: Build & Validate Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build Web App
        run: |
          cd apps/web
          npm install
          npm run build