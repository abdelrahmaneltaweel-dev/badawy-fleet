name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  secret-scan:
    name: Secret & Pattern Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Scan for forbidden patterns and secrets
        run: |
          echo "Scanning for forbidden keywords..."
          ! grep -rnIE \
            --exclude-dir=.git \
            --exclude-dir=.github \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude-dir=build \
            --exclude="ci.yml" \
            --exclude="package-lock.json" \
            "traccar.*\.com|http://[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+|eyJhbGciOi" .

  web-build:
    name: Build & Validate Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/web/package.json

      - name: Install Dependencies
        working-directory: apps/web
        run: npm install

      - name: Type Check & Build
        working-directory: apps/web
        run: npm run build

  logic-test:
    name: Logic & Schema Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & Run Tests
        working-directory: packages/logic
        run: |
          npm install
          npm test