name: Deploy to GitHub Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web Application
        id: build_step
        run: |
          if [ -f apps/web/package.json ]; then
            echo "Building Vite application in apps/web..."
            npm --prefix apps/web ci
            npm --prefix apps/web run build
            echo "output_dir=apps/web/dist" >> "$GITHUB_OUTPUT"
          elif [ -f apps/web/index.html ]; then
            echo "Using static apps/web/index.html"
            echo "output_dir=apps/web" >> "$GITHUB_OUTPUT"
          else
            echo "Staging current design preview for Pages..."
            mkdir -p _site
            if [ -f design/previews/Design-System-Preview-v0.3.0-draft.html ]; then
              cp design/previews/Design-System-Preview-v0.3.0-draft.html _site/index.html
            else
              echo "<!DOCTYPE html><html lang='ar' dir='rtl'><head><meta charset='utf-8'><title>Badawi Fleet Platform</title></head><body><h1>منصة أسطول بدوي</h1></body></html>" > _site/index.html
            fi
            echo "output_dir=_site" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.build_step.outputs.output_dir }}

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4