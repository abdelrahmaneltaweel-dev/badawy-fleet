name: "Spike S-8: Test Cleanup & Resource Quotas"

on:
  workflow_dispatch:

jobs:
  test-cleanup:
    name: Test Firestore Cleanup on Spark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd apps/worker
          npm install

      - name: Run Cleanup Benchmark
        run: |
          cd apps/worker
          node s8-cleanup-benchmark.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}